<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Story Generator — carfiable</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Montserrat', sans-serif; -webkit-font-smoothing: antialiased; }

    .gradient-text {
      background: linear-gradient(135deg, #3bd8ff, #3b61ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    @keyframes shimmer {
      0%   { background-position: -400px 0; }
      100% { background-position: 400px 0; }
    }
    .skeleton {
      background: linear-gradient(90deg, #1f2937 25%, #2d3748 50%, #1f2937 75%);
      background-size: 400px 100%;
      animation: shimmer 1.4s infinite;
      border-radius: 6px;
    }

    .step { display: none; }
    .step.active { display: block; }

    .cf-input {
      background: #1f2937;
      border: 1.5px solid #374151;
      color: white;
      border-radius: 10px;
      padding: 13px 16px;
      width: 100%;
      font-family: 'Montserrat', sans-serif;
      font-size: 15px;
      font-weight: 600;
      transition: border-color 0.18s;
      outline: none;
    }
    .cf-input:focus { border-color: #3865E9; }
    .cf-input::placeholder { color: #6b7280; font-weight: 400; }

    .car-card {
      background: #1f2937;
      border: 1.5px solid #2d3748;
      border-radius: 12px;
      cursor: pointer;
      transition: border-color 0.18s, background 0.18s;
      overflow: hidden;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 14px;
    }
    .car-card:hover { border-color: #3865E9; background: #1e2d4a; }
    .car-card:active { transform: scale(0.99); }

    .photo-item {
      cursor: pointer;
      border-radius: 8px;
      overflow: hidden;
      position: relative;
      aspect-ratio: 4/3;
      transition: opacity 0.2s, filter 0.2s, outline 0.15s;
      outline: 3px solid transparent;
    }
    .photo-item.selected   { outline-color: #3865E9; outline-offset: 2px; }
    .photo-item.deselected { opacity: 0.32; filter: grayscale(70%); }
    .photo-item img        { width: 100%; height: 100%; object-fit: cover; display: block; }

    .check-badge {
      position: absolute;
      top: 6px; right: 6px;
      width: 24px; height: 24px;
      background: #3865E9;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      opacity: 0;
      transition: opacity 0.15s;
      pointer-events: none;
    }
    .photo-item.selected .check-badge { opacity: 1; }

    /* Template thumbnails */
    .tpl-thumb {
      cursor: pointer;
      border-radius: 8px;
      overflow: hidden;
      border: 2.5px solid #374151;
      transition: border-color 0.18s, transform 0.15s;
      flex: 1;
    }
    .tpl-thumb:hover   { border-color: #6b7280; }
    .tpl-thumb.active  { border-color: #3865E9; transform: scale(1.04); }
    .tpl-preview       { aspect-ratio: 9/16; position: relative; overflow: hidden; }
    .tpl-label         { font-size: 11px; font-weight: 700; text-align: center; padding: 5px 0; background: #1f2937; color: #9ca3af; }
    .tpl-thumb.active .tpl-label { color: #3865E9; }

    .cf-btn {
      background: #3865E9;
      color: white;
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      font-size: 16px;
      padding: 16px 32px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      width: 100%;
      transition: opacity 0.18s, transform 0.12s;
      display: flex; align-items: center; justify-content: center; gap: 10px;
    }
    .cf-btn:hover:not(:disabled)  { opacity: 0.88; transform: translateY(-1px); }
    .cf-btn:active:not(:disabled) { transform: translateY(0); }
    .cf-btn:disabled               { opacity: 0.38; cursor: not-allowed; transform: none; }

    .cf-btn-secondary {
      background: transparent;
      color: #9ca3af;
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 14px;
      padding: 13px 24px;
      border: 1.5px solid #374151;
      border-radius: 12px;
      cursor: pointer;
      width: 100%;
      transition: border-color 0.18s, color 0.18s;
    }
    .cf-btn-secondary:hover { border-color: #6b7280; color: white; }

    .cf-btn-ghost {
      background: none;
      border: none;
      color: #6b7280;
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      padding: 8px 0;
      display: flex; align-items: center; gap: 6px;
      transition: color 0.18s;
    }
    .cf-btn-ghost:hover { color: white; }

    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.25);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }

    /* Search input wrapper */
    .search-wrapper { position: relative; }
    .search-icon {
      position: absolute;
      left: 14px; top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      color: #6b7280;
    }
    .search-input-pad { padding-left: 44px !important; }

    #result-img {
      max-width: 100%;
      border-radius: 14px;
      box-shadow: 0 24px 64px rgba(56,101,233,0.22);
    }

    .share-platform-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 13px 16px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      width: 100%;
      color: white;
      font-family: 'Montserrat', sans-serif;
      font-size: 13px;
      font-weight: 700;
      transition: opacity 0.18s, transform 0.12s;
    }
    .share-platform-btn:hover  { opacity: 0.88; transform: translateY(-1px); }
    .share-platform-btn:active { transform: translateY(0); opacity: 0.75; }
  </style>
</head>
<body class="bg-[#111827] text-white min-h-screen">

  <!-- ============================
       STEP 1: Buscar auto
  ============================= -->
  <div id="step-search" class="step active">
    <div class="max-w-lg mx-auto px-4 pt-14 pb-10">

      <!-- Logo -->
      <div class="flex justify-center mb-10">
        <img src="/ideas/negativo-color.svg" class="h-9 object-contain">
      </div>

      <!-- Headline -->
      <h1 class="text-2xl font-black text-center mb-1">Generar Story</h1>
      <p class="text-sm text-gray-500 text-center mb-8 font-medium">Busca el vehículo para diseñar</p>

      <!-- Search input -->
      <div class="search-wrapper mb-5">
        <svg class="search-icon" width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35" stroke-linecap="round"/>
        </svg>
        <input id="search-input" type="text" placeholder="Marca, modelo o año..." class="cf-input search-input-pad" autocomplete="off">
      </div>

      <!-- Results -->
      <div id="search-results"></div>
    </div>
  </div>

  <!-- ============================
       STEP 2: Confirmar datos
  ============================= -->
  <div id="step-confirm" class="step">
    <div class="max-w-lg mx-auto px-4 pt-8 pb-14">

      <!-- Back -->
      <button id="btn-back" class="cf-btn-ghost mb-7">
        <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/></svg>
        Volver
      </button>

      <h2 class="text-xl font-black mb-6">Confirmar datos</h2>

      <!-- Campos editables -->
      <div class="space-y-4 mb-8">
        <div class="flex gap-3">
          <div class="flex-1">
            <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1.5">Marca</label>
            <input id="f-marca" type="text" class="cf-input" placeholder="Toyota">
          </div>
          <div style="flex:2">
            <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1.5">Modelo</label>
            <input id="f-modelo" type="text" class="cf-input" placeholder="Tacoma">
          </div>
        </div>
        <div class="flex gap-3">
          <div class="flex-1">
            <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1.5">Año</label>
            <input id="f-anio" type="number" class="cf-input" placeholder="2022">
          </div>
          <div style="flex:2">
            <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1.5">Versión / Trim</label>
            <input id="f-version" type="text" class="cf-input" placeholder="TRD Sport">
          </div>
        </div>
        <div class="flex gap-3">
          <div class="flex-1">
            <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1.5">Kilometraje</label>
            <input id="f-km" type="number" class="cf-input" placeholder="45000">
          </div>
          <div class="flex-1">
            <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1.5">Etiqueta precio</label>
            <select id="f-oferta-label" class="cf-input" style="cursor:pointer;">
              <option value="PRECIO">PRECIO</option>
              <option value="ENGANCHE">ENGANCHE</option>
            </select>
          </div>
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1.5">Precio (MXN)</label>
          <input id="f-precio" type="number" class="cf-input" placeholder="850000">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1.5">Tipo de registro</label>
          <div id="f-registro-display" class="cf-input" style="background:#161e2d;color:#9ca3af;cursor:default;user-select:none;">—</div>
        </div>

        <!-- Opciones de financiamiento -->
        <details class="border border-[#2d3748] rounded-xl overflow-hidden">
          <summary class="flex items-center justify-between px-4 py-3 cursor-pointer text-xs font-bold text-gray-500 uppercase tracking-wider select-none hover:text-gray-300">
            Opciones de financiamiento
            <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"/></svg>
          </summary>
          <div class="px-4 pb-4 pt-2 space-y-3 bg-[#1a2030]">
            <div class="flex gap-3">
              <div class="flex-1">
                <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1.5">Plazo</label>
                <input id="f-plazo" type="text" class="cf-input" value="60 meses" placeholder="60 meses">
              </div>
              <div class="flex-1">
                <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1.5">Tasa mensual</label>
                <input id="f-tasa" type="text" class="cf-input" value="1%" placeholder="1%">
              </div>
            </div>
            <div>
              <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1.5">Etiqueta tasa</label>
              <input id="f-tasa-label" type="text" class="cf-input" value="Tasa mensual desde" placeholder="Tasa mensual desde">
            </div>
          </div>
        </details>
      </div>

      <!-- Fotos -->
      <div class="mb-8">
        <div class="flex items-center justify-between mb-3">
          <label class="text-xs font-bold text-gray-500 uppercase tracking-wider">Fotos</label>
          <span id="photo-count" class="text-xs text-gray-600 font-semibold"></span>
        </div>
        <div id="photo-grid" class="grid grid-cols-3 gap-2"></div>
      </div>

      <!-- Selector de plantilla -->
      <div class="mb-8">
        <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-3">Plantilla</label>
        <div class="flex gap-3" id="tpl-picker">

          <!-- T1: Dark Cinema -->
          <div class="tpl-thumb active" data-tpl="1">
            <div class="tpl-preview" style="background:#0a0c14;">
              <!-- Gradiente top-bottom -->
              <div style="position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,0.85) 0%,transparent 40%,rgba(0,0,0,0.92) 100%);"></div>
              <!-- Texto central -->
              <div style="position:absolute;top:18%;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:3px;">
                <div style="width:30%;height:3px;background:rgba(255,255,255,0.5);border-radius:2px;"></div>
                <div style="width:70%;height:8px;background:white;border-radius:3px;"></div>
                <div style="width:45%;height:4px;background:#3865E9;border-radius:2px;"></div>
              </div>
              <!-- Miniaturas inclinadas -->
              <div style="position:absolute;bottom:22%;left:-5%;right:-5%;height:14%;display:flex;gap:2px;transform:skewX(-12deg);overflow:hidden;">
                <div style="flex:1;background:rgba(255,255,255,0.15);border-radius:1px;"></div>
                <div style="flex:1;background:rgba(255,255,255,0.1);border-radius:1px;"></div>
              </div>
              <!-- Badge WA -->
              <div style="position:absolute;bottom:8%;left:50%;transform:translateX(-50%);background:#3865E9;border-radius:20px;padding:3px 10px;width:55%;height:7%;"></div>
            </div>
            <div class="tpl-label">Dark Cinema</div>
          </div>

          <!-- T2: Pen1 — Info-box + Fotos + Barra -->
          <div class="tpl-thumb" data-tpl="2">
            <div class="tpl-preview" style="background:#0a0e1a;position:relative;overflow:hidden;">
              <!-- Logo -->
              <div style="position:absolute;top:5%;left:50%;transform:translateX(-50%);width:30%;height:4px;background:rgba(255,255,255,0.5);border-radius:2px;"></div>
              <!-- Info-box bordeado -->
              <div style="position:absolute;top:16%;left:6%;right:6%;height:32%;border:1.5px solid rgba(255,255,255,0.7);border-radius:2px;display:flex;flex-direction:column;gap:2px;padding:5% 6%;">
                <div style="height:2px;background:rgba(255,255,255,0.4);border-radius:1px;width:35%;"></div>
                <div style="height:6px;background:#fff;border-radius:1px;width:75%;"></div>
                <div style="height:2px;background:rgba(255,255,255,0.5);border-radius:1px;width:50%;margin-top:2px;"></div>
                <div style="position:absolute;top:15%;right:6%;display:flex;flex-direction:column;align-items:flex-end;gap:2px;">
                  <div style="height:3px;background:linear-gradient(90deg,#4F6BFF,#00C6FF);border-radius:1px;width:32px;"></div>
                  <div style="height:5px;background:#fff;border-radius:1px;width:44px;"></div>
                </div>
              </div>
              <!-- Foto principal -->
              <div style="position:absolute;top:50%;left:0;right:0;height:22%;background:linear-gradient(135deg,#1a2540,#243050);"></div>
              <!-- 2 strips -->
              <div style="position:absolute;top:74%;left:0;right:0;height:10%;display:flex;gap:1px;">
                <div style="flex:1;background:#1f2937;"></div>
                <div style="flex:1;background:#243050;"></div>
              </div>
              <!-- Barra dark -->
              <div style="position:absolute;bottom:0;left:0;right:0;height:16%;background:#0a0e1a;display:flex;align-items:center;justify-content:center;gap:4px;padding:0 6%;">
                <div style="flex:1;height:3px;background:rgba(255,255,255,0.25);border-radius:1px;"></div>
                <div style="width:1px;height:18px;background:rgba(255,255,255,0.6);"></div>
                <div style="flex:1;height:3px;background:linear-gradient(90deg,#4F6BFF,#00C6FF);border-radius:1px;"></div>
              </div>
            </div>
            <div class="tpl-label">Pen 1</div>
          </div>

          <!-- T3: Pen2 — Foto fondo media + Barra sólida -->
          <div class="tpl-thumb" data-tpl="3">
            <div class="tpl-preview" style="background:#0a0e1a;position:relative;overflow:hidden;">
              <!-- Logo -->
              <div style="position:absolute;top:5%;left:50%;transform:translateX(-50%);width:30%;height:4px;background:rgba(255,255,255,0.5);border-radius:2px;"></div>
              <!-- Info-box -->
              <div style="position:absolute;top:14%;left:6%;right:6%;height:28%;border:1.5px solid rgba(255,255,255,0.7);border-radius:2px;padding:4% 6%;">
                <div style="height:5px;background:#fff;border-radius:1px;width:68%;"></div>
                <div style="height:2px;background:rgba(255,255,255,0.4);border-radius:1px;width:40%;margin-top:3px;"></div>
                <div style="position:absolute;top:15%;right:6%;display:flex;flex-direction:column;align-items:flex-end;gap:2px;">
                  <div style="height:3px;background:linear-gradient(90deg,#4F6BFF,#00C6FF);border-radius:1px;width:28px;"></div>
                  <div style="height:5px;background:#fff;border-radius:1px;width:40px;"></div>
                </div>
              </div>
              <!-- Foto como fondo (zona media) -->
              <div style="position:absolute;top:44%;left:0;right:0;bottom:32%;background:linear-gradient(135deg,#243050,#1a2540);"></div>
              <!-- Barra sólida dark -->
              <div style="position:absolute;bottom:0;left:0;right:0;height:32%;background:#0a0e1a;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px;padding:0 6%;">
                <div style="height:2px;background:rgba(255,255,255,0.3);border-radius:1px;width:80%;"></div>
                <div style="width:100%;height:1px;background:rgba(255,255,255,0.7);margin:3px 0;"></div>
                <div style="display:flex;align-items:center;gap:4px;width:100%;justify-content:center;">
                  <div style="flex:1;height:4px;background:rgba(255,255,255,0.4);border-radius:1px;"></div>
                  <div style="width:1px;height:16px;background:rgba(255,255,255,0.7);"></div>
                  <div style="flex:1;height:4px;background:linear-gradient(90deg,#4F6BFF,#00C6FF);border-radius:1px;"></div>
                </div>
              </div>
            </div>
            <div class="tpl-label">Pen 2</div>
          </div>

          <!-- T4: Pen3 — Split fotos arriba + Info-box abajo -->
          <div class="tpl-thumb" data-tpl="4">
            <div class="tpl-preview" style="background:#0a0e1a;position:relative;overflow:hidden;">
              <!-- Top split 2 fotos -->
              <div style="position:absolute;top:0;left:0;right:0;height:22%;display:flex;gap:1px;">
                <div style="flex:1;background:#1a2540;"></div>
                <div style="flex:1;background:#243050;"></div>
              </div>
              <!-- Logo centrado sobre el split -->
              <div style="position:absolute;top:3%;left:50%;transform:translateX(-50%);width:24%;height:3px;background:rgba(255,255,255,0.5);border-radius:2px;"></div>
              <!-- Foto hero -->
              <div style="position:absolute;top:23%;left:0;right:0;height:28%;background:linear-gradient(135deg,#1f2937,#1a2540);"></div>
              <!-- Info-box -->
              <div style="position:absolute;top:53%;left:6%;right:6%;height:28%;border:1.5px solid rgba(255,255,255,0.7);border-radius:2px;padding:4% 6%;">
                <div style="height:5px;background:#fff;border-radius:1px;width:68%;"></div>
                <div style="height:2px;background:rgba(255,255,255,0.4);border-radius:1px;width:40%;margin-top:3px;"></div>
                <div style="position:absolute;top:15%;right:6%;display:flex;flex-direction:column;align-items:flex-end;gap:2px;">
                  <div style="height:3px;background:linear-gradient(90deg,#4F6BFF,#00C6FF);border-radius:1px;width:28px;"></div>
                  <div style="height:5px;background:#fff;border-radius:1px;width:40px;"></div>
                </div>
              </div>
              <!-- Barra km + financiamiento -->
              <div style="position:absolute;bottom:0;left:0;right:0;height:18%;background:#0a0e1a;display:flex;flex-direction:column;justify-content:center;gap:2px;padding:0 6%;">
                <div style="height:2px;background:rgba(255,255,255,0.25);border-radius:1px;width:70%;"></div>
                <div style="width:100%;height:1px;background:rgba(255,255,255,0.6);margin:2px 0;"></div>
                <div style="display:flex;align-items:center;gap:4px;width:100%;justify-content:center;">
                  <div style="flex:1;height:3px;background:rgba(255,255,255,0.35);border-radius:1px;"></div>
                  <div style="width:1px;height:14px;background:rgba(255,255,255,0.6);"></div>
                  <div style="flex:1;height:3px;background:linear-gradient(90deg,#4F6BFF,#00C6FF);border-radius:1px;"></div>
                </div>
              </div>
            </div>
            <div class="tpl-label">Pen 3</div>
          </div>

        </div>
      </div>

      <!-- Botón generar -->
      <button id="btn-generate" class="cf-btn" disabled>
        Generar Story
      </button>
    </div>
  </div>

  <!-- ============================
       STEP 3: Resultado
  ============================= -->
  <div id="step-result" class="step">
    <div class="max-w-lg mx-auto px-4 pt-8 pb-14">

      <button id="btn-back-result" class="cf-btn-ghost mb-6">
        <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/></svg>
        Volver
      </button>

      <h2 class="text-xl font-black mb-1">Story generado</h2>
      <p class="text-sm text-gray-500 mb-6 font-medium">Elige cómo compartir</p>

      <!-- Imagen -->
      <div class="mb-6 text-center">
        <img id="result-img" src="" alt="Story generado">
      </div>

      <!-- ── Compartir ── -->
      <p class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-3">Compartir en</p>

      <!-- Fila plataformas -->
      <div class="grid grid-cols-2 gap-2 mb-2">

        <!-- Instagram Story -->
        <button class="share-platform-btn" onclick="shareImage('instagram-story')"
          style="background:linear-gradient(135deg,#f09433 0%,#e6683c 25%,#dc2743 50%,#cc2366 75%,#bc1888 100%);">
          <svg width="22" height="22" fill="none" stroke="white" stroke-width="1.8" viewBox="0 0 24 24">
            <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><circle cx="12" cy="12" r="5"/>
            <circle cx="17.5" cy="6.5" r="1" fill="white" stroke="none"/>
          </svg>
          <div>
            <div style="font-weight:800;font-size:13px;">Instagram</div>
            <div style="font-size:10px;opacity:0.85;">Story · Publicación</div>
          </div>
        </button>

        <!-- WhatsApp -->
        <button class="share-platform-btn" onclick="shareImage('whatsapp')"
          style="background:#128C7E;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="white">
            <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/>
            <path d="M12.004 2C6.477 2 2 6.484 2 12.017c0 1.99.525 3.851 1.438 5.459L2 22l4.674-1.425A9.956 9.956 0 0012.004 22C17.523 22 22 17.516 22 11.983 22 6.451 17.523 2 12.004 2zm0 18.055a8.086 8.086 0 01-4.378-1.28l-.315-.19-3.239.984.934-3.327-.207-.333a8.11 8.11 0 01-1.267-4.309c0-4.51 3.609-8.181 8.076-8.181 2.16 0 4.189.855 5.716 2.41a8.094 8.094 0 012.368 5.741c-.01 4.51-3.62 8.485-8.688 8.485z"/>
          </svg>
          <div>
            <div style="font-weight:800;font-size:13px;">WhatsApp</div>
            <div style="font-size:10px;opacity:0.85;">Enviar imagen</div>
          </div>
        </button>

        <!-- Facebook -->
        <button class="share-platform-btn" onclick="shareImage('facebook')"
          style="background:#1877F2;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="white">
            <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
          </svg>
          <div>
            <div style="font-weight:800;font-size:13px;">Facebook</div>
            <div style="font-size:10px;opacity:0.85;">Story · Publicación</div>
          </div>
        </button>

        <!-- Más opciones / Sistema -->
        <button class="share-platform-btn" onclick="shareImage('native')"
          style="background:#374151;border:1.5px solid #4b5563;">
          <svg width="22" height="22" fill="none" stroke="white" stroke-width="2" viewBox="0 0 24 24">
            <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
            <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
          </svg>
          <div>
            <div style="font-weight:800;font-size:13px;">Más opciones</div>
            <div style="font-size:10px;opacity:0.85;">Compartir en otras apps</div>
          </div>
        </button>
      </div>

      <!-- Descargar -->
      <a id="btn-download" href="" download="story-carfiable.jpg"
        class="cf-btn no-underline mb-2 mt-2" style="text-decoration:none;">
        <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
        </svg>
        Descargar imagen
      </a>

      <button id="btn-restart" class="cf-btn-secondary mt-2">Generar otra</button>
    </div>
  </div>

  <!-- Toast -->
  <div id="share-toast" style="
    position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(20px);
    background:#1f2937;color:#fff;font-family:'Montserrat',sans-serif;font-size:13px;font-weight:600;
    padding:12px 20px;border-radius:40px;box-shadow:0 8px 32px rgba(0,0,0,0.5);
    opacity:0;transition:opacity 0.25s,transform 0.25s;pointer-events:none;white-space:nowrap;z-index:999;">
  </div>

<script>
  // ─── Estado global ─────────────────────────────────────────────────────────
  const state = {
    query: '',
    results: [],
    car: null,
    photos: [],
    selected: [],
    template: 1,
    procedencia: null,
    debouncer: null
  };

  // ─── Navegación ────────────────────────────────────────────────────────────
  function showStep(id) {
    document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // ─── Formateo de precio ────────────────────────────────────────────────────
  function fmtPrice(n) {
    return new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN', minimumFractionDigits: 0 }).format(n);
  }

  // ─── STEP 1: Búsqueda ──────────────────────────────────────────────────────
  const searchInput = document.getElementById('search-input');
  const resultsEl   = document.getElementById('search-results');

  searchInput.addEventListener('input', e => {
    const q = e.target.value.trim();
    state.query = q;
    clearTimeout(state.debouncer);
    if (q.length < 2) { resultsEl.innerHTML = ''; return; }
    renderSkeletons(4);
    state.debouncer = setTimeout(() => doSearch(q), 320);
  });

  function renderSkeletons(n) {
    resultsEl.innerHTML = Array.from({ length: n }).map(() => `
      <div class="flex items-center gap-3 p-3 rounded-xl border border-[#2d3748] mb-2">
        <div class="skeleton w-20 h-14 flex-shrink-0 rounded-lg"></div>
        <div class="flex-1 space-y-2">
          <div class="skeleton h-4 w-3/4"></div>
          <div class="skeleton h-3 w-1/2"></div>
          <div class="skeleton h-3 w-1/3"></div>
        </div>
      </div>
    `).join('');
  }

  async function doSearch(q) {
    try {
      const res = await fetch(`/api/search?q=${encodeURIComponent(q)}`);
      if (!res.ok) throw new Error('Error en búsqueda');
      const data = await res.json();
      state.results = Array.isArray(data) ? data : (data.data || data.results || []);
      renderResults(state.results);
    } catch (err) {
      resultsEl.innerHTML = `<p class="text-red-400 text-sm text-center py-6 font-semibold">Error al buscar. Intenta de nuevo.</p>`;
    }
  }

  function getThumb(car) {
    // La API de carfiable devuelve images[].image_url
    const imgs = car.images || car.photos || car.exterior || car.fotos || [];
    const arr = Array.isArray(imgs) ? imgs : [imgs];
    if (!arr.length) return '';
    const first = arr[0];
    return typeof first === 'string' ? first : (first?.image_url || first?.url || first?.src || '');
  }

  function renderResults(cars) {
    if (!cars.length) {
      resultsEl.innerHTML = `<p class="text-gray-600 text-sm text-center py-10 font-semibold">Sin resultados para esta búsqueda.</p>`;
      return;
    }
    resultsEl.innerHTML = cars.map(car => {
      const thumb = getThumb(car);
      const name  = [car.year || car.anio, car.make || '', car.model || car.modelo || ''].filter(Boolean).join(' ');
      const ver   = car.version || car.trim || car.specs?.Submodel || car.specs?.Trim || '';
      const price = parseFloat(car.price || car.precio) || 0;
      return `
        <div class="car-card mb-2" onclick="selectCar(${car.id})">
          ${thumb
            ? `<img src="${thumb}" class="w-20 h-14 object-cover rounded-lg flex-shrink-0 bg-gray-700"
                    onerror="this.style.display='none'">`
            : `<div class="w-20 h-14 rounded-lg flex-shrink-0 bg-gray-700 flex items-center justify-center">
                 <svg width="24" height="24" fill="none" stroke="#4b5563" viewBox="0 0 24 24">
                   <rect x="2" y="8" width="20" height="12" rx="2"/><path d="M16 8V6a2 2 0 00-2-2h-4a2 2 0 00-2 2v2"/>
                 </svg>
               </div>`
          }
          <div class="flex-1 min-w-0">
            <p class="font-bold text-white text-sm truncate">${name}</p>
            ${ver ? `<p class="text-xs text-gray-400 truncate font-semibold">${ver}</p>` : ''}
            ${price ? `<p class="text-sm font-black gradient-text">${fmtPrice(price)}</p>` : ''}
          </div>
          <svg class="flex-shrink-0 text-gray-600" width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
          </svg>
        </div>
      `;
    }).join('');
  }

  // ─── Seleccionar auto y cargar detalle ─────────────────────────────────────
  async function selectCar(id) {
    // Loading inline
    const card = document.querySelector(`[onclick="selectCar(${id})"]`);
    if (card) {
      card.innerHTML = `<div class="flex items-center gap-3 text-gray-400 py-1 text-sm font-semibold"><span class="spinner"></span> Cargando...</div>`;
      card.style.cursor = 'default';
    }
    try {
      const res = await fetch(`/api/car/${id}`);
      if (!res.ok) throw new Error('No encontrado');
      const raw = await res.json();
      // Normalizar: puede venir como objeto directo o dentro de .data
      state.car = raw?.data || (Array.isArray(raw) ? raw[0] : raw);
      populateForm(state.car);
      showStep('step-confirm');
    } catch (err) {
      if (card) {
        card.innerHTML = `<p class="text-red-400 text-sm font-semibold py-1">Error al cargar. Intenta de nuevo.</p>`;
        card.style.cursor = 'pointer';
      }
    }
  }

  // ─── STEP 2: Formulario ────────────────────────────────────────────────────
  function normalizePhotos(car) {
    // La API devuelve images[].image_url con type: 'exterior' | 'interior'
    const raw = car.images || car.photos || car.exterior || car.fotos || [];
    const arr = Array.isArray(raw) ? raw : (typeof raw === 'string' ? [raw] : []);
    return arr
      .filter(p => !p?.type || p.type === 'exterior')   // preferir fotos exteriores
      .map(p => typeof p === 'string' ? p : (p?.image_url || p?.url || p?.src || ''))
      .filter(Boolean);
  }

  function populateForm(car) {
    document.getElementById('f-marca').value   = car.make  || car.marca   || '';
    document.getElementById('f-anio').value    = car.year  || car.anio    || '';
    document.getElementById('f-modelo').value  = car.model || car.modelo  || '';
    document.getElementById('f-version').value = car.version || car.trim
      || car.specs?.Submodel || car.specs?.Trim || '';
    document.getElementById('f-precio').value  = parseFloat(car.price || car.precio) || '';
    // km
    const km = car.km || car.kilometraje || car.mileage
      || parseInt(car.specs?.Mileage || car.specs?.Odometer || 0) || '';
    document.getElementById('f-km').value = km;
    // Oferta label — reset a PRECIO por defecto
    document.getElementById('f-oferta-label').value = 'PRECIO';

    // Procedencia / tipo de registro — campo real de la API: registration_type
    const REGISTRO_LABELS = {
      'fronterizo':         'Fronterizo',
      'nacional_agencia':   'Mexicano de agencia',
      'nacional_pedimento': 'Nacional Pedimento',
      'nacional_decreto':   'Nacional Decreto'
    };
    const rawRegistro = (
      car.registration_type || car.procedencia || car.registro ||
      car.specs?.registration_type || car.specs?.Procedencia || ''
    ).toLowerCase().trim();
    const procedencia = REGISTRO_LABELS[rawRegistro] || (rawRegistro ? rawRegistro.toUpperCase() : 'MEXICANO DE AGENCIA');
    state.procedencia = procedencia;
    document.getElementById('f-registro-display').textContent = procedencia;

    // Financiamiento automático según registro
    const esMexAgencia = rawRegistro === 'nacional_agencia';
    document.getElementById('f-plazo').value      = esMexAgencia ? '60 meses' : '48 meses';
    document.getElementById('f-tasa').value       = esMexAgencia ? '1%' : '2%';
    document.getElementById('f-tasa-label').value = 'Tasa mensual desde';

    state.photos   = normalizePhotos(car);
    state.selected = [...state.photos];

    renderPhotoGrid();
    updateGenerateBtn();
  }

  function renderPhotoGrid() {
    const grid = document.getElementById('photo-grid');
    const count = document.getElementById('photo-count');

    if (!state.photos.length) {
      grid.innerHTML = `<p class="text-gray-600 text-xs col-span-3 font-semibold">No hay fotos disponibles.</p>`;
      count.textContent = '';
      return;
    }

    count.textContent = `${state.selected.length} de ${state.photos.length} seleccionadas`;

    grid.innerHTML = state.photos.map((url, i) => {
      const isSel = state.selected.includes(url);
      return `
        <div class="photo-item ${isSel ? 'selected' : 'deselected'}" data-url="${url}" onclick="togglePhoto(this)">
          <img src="${url}" loading="lazy" onerror="this.parentElement.style.display='none'">
          <div class="check-badge">
            <svg width="12" height="12" fill="none" stroke="white" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/>
            </svg>
          </div>
        </div>
      `;
    }).join('');
  }

  function togglePhoto(el) {
    const url = el.dataset.url;
    const isSelected = el.classList.contains('selected');
    if (isSelected) {
      if (state.selected.length <= 1) return; // mínimo 1
      state.selected = state.selected.filter(u => u !== url);
      el.classList.replace('selected', 'deselected');
    } else {
      if (!state.selected.includes(url)) state.selected.push(url);
      el.classList.replace('deselected', 'selected');
    }
    document.getElementById('photo-count').textContent = `${state.selected.length} de ${state.photos.length} seleccionadas`;
    updateGenerateBtn();
  }

  function updateGenerateBtn() {
    const modelo = document.getElementById('f-modelo').value.trim();
    const precio = document.getElementById('f-precio').value;
    const btn    = document.getElementById('btn-generate');
    btn.disabled = !(modelo && precio && state.selected.length > 0);
  }

  // Actualizar botón en tiempo real al editar campos
  ['f-marca','f-modelo','f-precio','f-anio','f-version','f-km'].forEach(id => {
    document.getElementById(id).addEventListener('input', updateGenerateBtn);
  });

  // ─── Selector de plantilla ─────────────────────────────────────────────────
  document.querySelectorAll('.tpl-thumb').forEach(el => {
    el.addEventListener('click', () => {
      document.querySelectorAll('.tpl-thumb').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
      state.template = parseInt(el.dataset.tpl);
    });
  });

  // ─── Generar story ─────────────────────────────────────────────────────────
  document.getElementById('btn-generate').addEventListener('click', async () => {
    const btn = document.getElementById('btn-generate');
    btn.disabled = true;
    btn.innerHTML = `<span class="spinner"></span> Generando...`;

    const payload = {
      marca:       document.getElementById('f-marca').value.trim(),
      anio:        parseInt(document.getElementById('f-anio').value) || 0,
      modelo:      document.getElementById('f-modelo').value.trim(),
      version:     document.getElementById('f-version').value.trim(),
      precio:      parseFloat(document.getElementById('f-precio').value) || 0,
      km:          parseInt(document.getElementById('f-km').value) || 0,
      procedencia: state.procedencia || 'MEXICANO DE AGENCIA',
      ofertaLabel: document.getElementById('f-oferta-label').value,
      plazo:       document.getElementById('f-plazo').value.trim()      || '60 meses',
      tasa:        document.getElementById('f-tasa').value.trim()       || '1%',
      tasaLabel:   document.getElementById('f-tasa-label').value.trim() || 'Tasa mensual desde',
      exterior:    state.selected,
      template:    state.template
    };

    if (!payload.modelo || !payload.precio) {
      alert('Por favor completa modelo y precio.');
      btn.disabled = false;
      btn.textContent = 'Generar Story';
      return;
    }

    try {
      const res = await fetch('/generate-story', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      if (!res.ok) throw new Error(`Error ${res.status}`);

      const blob = await res.blob();
      const objURL = URL.createObjectURL(blob);

      // Revocar URL anterior si existe
      const prevImg = document.getElementById('result-img');
      if (prevImg.src.startsWith('blob:')) URL.revokeObjectURL(prevImg.src);

      prevImg.src = objURL;
      document.getElementById('btn-download').href = objURL;
      showStep('step-result');

    } catch (err) {
      alert('Error al generar el story. Verifica que el servidor esté activo.');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Generar Story';
      updateGenerateBtn();
    }
  });

  // ─── Navegación entre pasos ────────────────────────────────────────────────
  document.getElementById('btn-back').addEventListener('click', () => showStep('step-search'));

  document.getElementById('btn-back-result').addEventListener('click', () => showStep('step-confirm'));

  document.getElementById('btn-restart').addEventListener('click', () => {
    const img = document.getElementById('result-img');
    if (img.src.startsWith('blob:')) URL.revokeObjectURL(img.src);
    img.src = '';
    // Reset búsqueda
    searchInput.value = '';
    resultsEl.innerHTML = '';
    // Reset estado
    state.car = null;
    state.photos = [];
    state.selected = [];
    state.procedencia = null;
    // Reset campos del formulario
    ['f-marca','f-modelo','f-anio','f-version','f-precio','f-km'].forEach(id => {
      document.getElementById(id).value = '';
    });
    document.getElementById('f-oferta-label').value = 'PRECIO';
    document.getElementById('f-plazo').value         = '60 meses';
    document.getElementById('f-tasa').value          = '1%';
    document.getElementById('f-tasa-label').value    = 'Tasa mensual desde';
    document.getElementById('f-registro-display').textContent = '—';
    document.getElementById('photo-grid').innerHTML  = '';
    document.getElementById('photo-count').textContent = '';
    // Reset plantilla seleccionada
    document.querySelectorAll('.tpl-thumb').forEach(t => t.classList.remove('active'));
    document.querySelector('[data-tpl="1"]').classList.add('active');
    state.template = 1;
    showStep('step-search');
  });

  // ─── Compartir imagen ───────────────────────────────────────────────────────
  async function getImageFile() {
    const src = document.getElementById('result-img').src;
    const res  = await fetch(src);
    const blob = await res.blob();
    return new File([blob], 'story-carfiable.jpg', { type: 'image/jpeg' });
  }

  function showToast(msg) {
    const t = document.getElementById('share-toast');
    t.textContent = msg;
    t.style.opacity   = '1';
    t.style.transform = 'translateX(-50%) translateY(0)';
    clearTimeout(t._timer);
    t._timer = setTimeout(() => {
      t.style.opacity   = '0';
      t.style.transform = 'translateX(-50%) translateY(20px)';
    }, 3200);
  }

  async function shareImage(platform) {
    try {
      const file = await getImageFile();
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: 'Story Carfiable' });
        return;
      }
      // Fallback: download + hint
      document.getElementById('btn-download').click();
      const hints = {
        'instagram-story': 'Imagen descargada. Ábrela en Instagram → + → Historia',
        'whatsapp':        'Imagen descargada. Adjúntala en WhatsApp',
        'facebook':        'Imagen descargada. Súbela desde Facebook',
        'native':          'Imagen descargada en tu dispositivo'
      };
      showToast(hints[platform] || 'Imagen descargada');
    } catch(e) {
      if (e.name !== 'AbortError') showToast('Error al compartir. Intenta descargar.');
    }
  }
</script>
